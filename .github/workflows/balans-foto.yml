# One-off: downloads free (CC0 / public domain / CC BY) photo candidates for the balance card and commits them.
name: Balans photos
on:
  push:
    branches: [claude/project-thread-tfce6j]
    paths: [scripts/fetch_balans_photos.py, .github/workflows/balans-foto.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python scripts/fetch_balans_photos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/balans/kandidati
          git commit -m "Balans: photo candidates (Openverse/Wikimedia)" && git push
