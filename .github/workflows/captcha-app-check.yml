# One-off check: does the CAPTCHA (Turnstile) on the login page work inside the Android app?
# Installs the current beta APK on an emulator, opens /login in the app's WebView and reports the widget state.
name: CAPTCHA in the Android app

on:
  pull_request:
    paths:
      - '.github/workflows/captcha-app-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-beta -p zadatak-beta.apk -R "${{ github.repository }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script
        run: |
          cat > check.mjs <<'EOF'
          // raw DevTools protocol: the app's WebView does not support Playwright's browser-level commands
          const list = await (await fetch('http://127.0.0.1:9222/json')).json()
          console.log(list.map((t) => `${t.type} ${t.url.slice(0, 100)}`).join('\n'))
          const target = list.find((t) => t.type === 'page')
          const ws = new WebSocket(target.webSocketDebuggerUrl)
          await new Promise((r) => ws.addEventListener('open', r))
          let id = 0
          const pending = new Map()
          ws.addEventListener('message', (e) => { const m = JSON.parse(e.data); if (pending.has(m.id)) { pending.get(m.id)(m); pending.delete(m.id) } })
          const send = (method, params = {}) => new Promise((r) => { pending.set(++id, r); ws.send(JSON.stringify({ id, method, params })) })
          const run = async (expression) => (await send('Runtime.evaluate', { expression, returnByValue: true })).result?.result?.value
          console.log('app page:', await run('location.href'))
          await run("location.href = '/websample/login'")
          await new Promise((r) => setTimeout(r, 30000))
          console.log('now at:', await run('location.href'))
          console.log('iframes:', await run("[...document.querySelectorAll('iframe')].map((f) => f.src.slice(0, 80)).join(' | ')"))
          console.log('turnstile token length:', await run("document.querySelector('[name=\"cf-turnstile-response\"]')?.value?.length ?? -1"))
          console.log('login button disabled:', await run("[...document.querySelectorAll('button[type=submit]')].map((b) => b.disabled).join(',')"))
          const after = await (await fetch('http://127.0.0.1:9222/json')).json()
          console.log(after.map((t) => `${t.type} ${t.url.slice(0, 100)}`).join('\n'))
          process.exit(0)
          EOF
          cat > run.sh <<'EOF'
          set -x
          mkdir -p screens
          adb install -r zadatak-beta.apk
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard
          adb shell am start -n ba.zadatak.app/ba.poso.app.MainActivity
          sleep 40
          PID=$(adb shell pidof ba.zadatak.app | tr -d '\r')
          adb forward tcp:9222 localabstract:webview_devtools_remote_$PID
          curl -s http://127.0.0.1:9222/json/version
          node check.mjs || true
          adb exec-out screencap -p > screens/prijava.png
          EOF
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captcha-app-screens
          path: screens/*
