# One-off check: does the CAPTCHA (Turnstile) on the login page work inside the Android app?
# Installs the current beta APK on an emulator, opens /login in the app's WebView and reports the widget state.
name: CAPTCHA in the Android app

on:
  pull_request:
    paths:
      - '.github/workflows/captcha-app-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-beta -p zadatak-beta.apk -R "${{ github.repository }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script
        run: |
          cat > check.mjs <<'EOF'
          // raw DevTools protocol: the app's WebView does not support Playwright's browser-level commands
          const list = await (await fetch('http://127.0.0.1:9222/json')).json()
          console.log(list.map((t) => `${t.type} ${t.url.slice(0, 100)}`).join('\n'))
          // one short connection per question: the page target can be replaced when it navigates
          const ask = async (method, params) => {
            const t = (await (await fetch('http://127.0.0.1:9222/json')).json()).find((t) => t.type === 'page')
            const ws = new WebSocket(t.webSocketDebuggerUrl)
            await new Promise((r) => ws.addEventListener('open', r))
            const out = await new Promise((r) => { ws.addEventListener('message', (e) => r(JSON.parse(e.data))); ws.send(JSON.stringify({ id: 1, method, params })) })
            ws.close()
            return out
          }
          const run = async (expression) => (await ask('Runtime.evaluate', { expression, returnByValue: true })).result?.result?.value
          console.log('app page:', await run('location.href'))
          console.log('navigate:', JSON.stringify(await ask('Page.navigate', { url: 'https://bilalishakcanada-wq.github.io/websample/login' })))
          for (let i = 0; i < 8; i++) {
            await new Promise((r) => setTimeout(r, 5000))
            console.log(i, 'at:', await run('location.href').catch((e) => 'err ' + e.message), 'token:', await run("document.querySelector('[name=\"cf-turnstile-response\"]')?.value?.length ?? -1").catch(() => 'err'))
          }
          console.log('iframes:', await run("[...document.querySelectorAll('iframe')].map((f) => f.src.slice(0, 80)).join(' | ')"))
          console.log('page text:', (await run('document.body.innerText'))?.replace(/\s+/g, ' ').slice(0, 400))
          console.log('submit disabled:', await run("[...document.querySelectorAll('button[type=submit]')].map((b) => b.disabled).join(',')"))
          const after = await (await fetch('http://127.0.0.1:9222/json')).json()
          console.log(after.map((t) => `${t.type} ${t.url.slice(0, 100)}`).join('\n'))
          process.exit(0)
          EOF
          cat > run.sh <<'EOF'
          set -x
          mkdir -p screens
          adb install -r zadatak-beta.apk
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard
          adb shell am start -n ba.zadatak.app/ba.poso.app.MainActivity
          sleep 40
          PID=$(adb shell pidof ba.zadatak.app | tr -d '\r')
          adb forward tcp:9222 localabstract:webview_devtools_remote_$PID
          curl -s http://127.0.0.1:9222/json/version
          node check.mjs || true
          adb exec-out screencap -p > screens/prijava.png
          EOF
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captcha-app-screens
          path: screens/*
