# Builds the site on GitHub's servers and publishes it to GitHub Pages on every push to main.
# Site: https://bilalishakcanada-wq.github.io/websample/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://kshzsnceukbpwpgpicsh.supabase.co
  # the anon key is a public client key (it ships inside the JS bundle either way)
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzaHpzbmNldWticHdwZ3BpY3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODc1NjAsImV4cCI6MjEwNDk2MzU2MH0.ujTU0htJr76rnP5-3B_qLxTZsT1hXQBh4TXNIwnf_x0

jobs:
  # The gate: the whole job flow (post → offer → escrow → realtime chat → release → review)
  # runs in a real browser against the real backend. Nothing deploys if it fails.
  # Needs the E2E_* secrets (Settings → Secrets → Actions); without them the gate is
  # skipped with a warning, so add them to arm it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
      E2E_PROVIDER_EMAIL: ${{ secrets.E2E_PROVIDER_EMAIL }}
      E2E_PROVIDER_PASSWORD: ${{ secrets.E2E_PROVIDER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check test accounts
        id: gate
        run: |
          if [ -z "$E2E_CLIENT_EMAIL" ] || [ -z "$E2E_PROVIDER_EMAIL" ]; then
            echo "::warning title=E2E gate not armed::Add E2E_CLIENT_EMAIL/PASSWORD and E2E_PROVIDER_EMAIL/PASSWORD secrets to run the end-to-end tests before every deploy."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build for tests (no service worker)
        if: steps.gate.outputs.armed == 'true'
        run: npm run build
        env:
          VITE_NO_PWA: '1'
          VITE_APP_NAME: Poso.ba
          VITE_DEFAULT_LOCALE: bs
      - name: Install Chromium
        if: steps.gate.outputs.armed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        if: steps.gate.outputs.armed == 'true'
        run: npx playwright test
        env:
          CI: 'true'
      - name: Upload report
        if: always() && steps.gate.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (base /websample/)
        env:
          VITE_BASE: /websample/
          VITE_APP_NAME: Poso.ba
          VITE_DEFAULT_LOCALE: bs
          VITE_SUPABASE_URL: https://kshzsnceukbpwpgpicsh.supabase.co
          # the anon key is a public client key (it ships inside the JS bundle either way)
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzaHpzbmNldWticHdwZ3BpY3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODc1NjAsImV4cCI6MjEwNDk2MzU2MH0.ujTU0htJr76rnP5-3B_qLxTZsT1hXQBh4TXNIwnf_x0
        run: npm run build
      - name: SPA fallback + no Jekyll
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      # GitHub's CDN keeps index.html for ~10 minutes: someone who loads a stale copy right after a
      # deploy must still find the chunks it names — so the previous build's files ride along once.
      - name: Keep the previous build's chunks
        run: |
          git fetch --depth=1 origin gh-pages 2>/dev/null || exit 0
          prev=$(mktemp -d)
          for f in sw.js index.html; do git show "origin/gh-pages:$f" > "$prev/$f" 2>/dev/null || true; done
          # only the previous build's own entry chunk (not chunks it carried over itself — that would grow forever)
          entry=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' "$prev/index.html" | head -1)
          [ -n "$entry" ] && git show "origin/gh-pages:$entry" > "$prev/entry.js" 2>/dev/null || true
          cat "$prev"/* 2>/dev/null | grep -oE '[A-Za-z0-9._-]+-[A-Za-z0-9_-]{8}\.(js|css|woff2)' | sort -u | while read -r name; do
            [ -e "dist/assets/$name" ] && continue
            git show "origin/gh-pages:assets/$name" > "dist/assets/$name" 2>/dev/null || rm -f "dist/assets/$name"
          done
          echo "carried over: $(ls dist/assets | wc -l) files in assets/"
      # publishes dist to the gh-pages branch; GitHub serves that branch as the site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
