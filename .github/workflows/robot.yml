# The test robot (robot/README.md): on every pull request, and every night, it builds a private copy
# of the database with test accounts, runs the end-to-end money path, then checks every main page on a
# computer, a phone and a small phone as a guest, a new account, a client and a worker for what customers
# trip over: covered or overlapping buttons and fields, things cut off at the screen edge, fields without
# a label, crashes and failed requests. The report (screenshots with the problem outlined in red) is
# attached to the run as "robot-report". Nothing here touches the live site or the live database.
# Run by hand with "site" set to a URL, it only looks at that site as a guest (no logins, no presses).
name: Robot

on:
  pull_request:
  workflow_dispatch:
    inputs:
      site:
        description: 'Check this site as a guest instead (e.g. https://bilalishakcanada-wq.github.io/websample)'
        required: false
        default: ''
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: robot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.site != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Robot looks at the site as a guest
        run: node robot/explore.mjs
        env:
          ROBOT_BASE_URL: ${{ inputs.site }}
          ROBOT_ROLES: guest
      - name: Report
        if: always()
        run: |
          if [ -f robot-report/report.md ]; then { head -c 60000 robot-report/report.md >> "$GITHUB_STEP_SUMMARY"; head -c 8000 robot-report/report.md; }; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-report
          path: robot-report/
          retention-days: 14

  robot:
    if: github.event_name != 'workflow_dispatch' || inputs.site == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BASE_URL: http://localhost:4175
      E2E_CLIENT_EMAIL: klijent@test.zadatak
      E2E_CLIENT_PASSWORD: Test12345!
      E2E_PROVIDER_EMAIL: izvodjac@test.zadatak
      E2E_PROVIDER_PASSWORD: Test12345!
      E2E_ADMIN_EMAIL: admin@test.zadatak
      E2E_ADMIN_PASSWORD: Test12345!
      # a worker holding every badge a job can require; exists only in this private database
      E2E_TESTER_EMAIL: majstor@test.zadatak
      E2E_TESTER_PASSWORD: Test12345!
      ROBOT_BASE_URL: http://localhost:4175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start the local test database
        run: bash robot/local-db/setup.sh
      - name: Build the site against it
        run: npx vite build
      - name: Serve the site
        run: |
          nohup npx vite preview --port 4175 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4175 >/dev/null && break; sleep 1; done
      - name: End-to-end tests (ID check before posting, post, offer, pay, chat, deliver, approve, review)
        # the ID-check tests leave the worker's ID "submitted" (no offers allowed), so they run last
        run: |
          npx playwright test $(ls e2e/*.spec.js | grep -v identity)
          npx playwright test $(ls e2e/*.spec.js | grep identity)
      - name: Fill the database with sample jobs, offers and a paid job
        if: always()
        run: |
          bash robot/local-db/reset.sh
          export $(cat robot/local-db/.anon)
          node robot/seed.mjs
      - name: Robot checks every page for covered, overlapping and cut-off buttons and fields
        if: always()
        run: node robot/explore.mjs
      - name: Report
        if: always()
        run: |
          if [ -f robot-report/report.md ]; then { head -c 60000 robot-report/report.md >> "$GITHUB_STEP_SUMMARY"; head -c 8000 robot-report/report.md; }; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-report
          path: |
            robot-report/
            playwright-report/
            test-results/
          retention-days: 14
