<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Archivo:wdth,wght@75..100,600..900&display=swap" />
    <meta name="theme-color" content="#0d2a52" />
    <meta name="description" content="Poso.ba — pronađite ili ponudite lokalne usluge u Bosni i Hercegovini." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poso.ba" />
    <title>Poso.ba — Marketplace za usluge</title>
    <script>
      // OAuth return for the installed app / installed web app. The system browser lands here with
      // the session in the hash:
      //  - ?native=1  → hand it straight to the app (ba.poso.app://…)
      //  - ?handoff=n → park it for the home-screen web app (it claims it when it regains focus)
      (function () {
        try {
          var hash = location.hash || ''
          var q = new URLSearchParams(location.search)
          if (hash.indexOf('access_token=') === -1 && !q.get('code')) return
          if (q.get('native') === '1') {
            var target = 'ba.poso.app://auth/callback' + (q.get('code') ? '?code=' + q.get('code') : '') + hash
            history.replaceState(null, '', location.pathname)
            document.documentElement.setAttribute('data-native-return', '1')
            location.replace(target)
            setTimeout(function () {
              var note = document.getElementById('native-return')
              if (note) { note.style.display = 'grid'; note.querySelector('a').href = target }
            }, 1200)
            return
          }
          var nonce = q.get('handoff')
          if (nonce && hash.indexOf('access_token=') !== -1) {
            var h = new URLSearchParams(hash.replace(/^#/, ''))
            var body = JSON.stringify({ p_nonce: nonce, p_access: h.get('access_token'), p_refresh: h.get('refresh_token') })
            var key = '%VITE_SUPABASE_ANON_KEY%'
            fetch('%VITE_SUPABASE_URL%/rest/v1/rpc/store_auth_handoff', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: key, Authorization: 'Bearer ' + key }, body: body })
              .then(function () {
                // only when this page is the in-app browser view, not the installed app itself
                var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true
                var note = document.getElementById('native-return')
                if (note && !standalone) { note.style.display = 'grid'; note.querySelector('p').textContent = 'Prijava je uspjela — vrati se u Poso.ba aplikaciju na početnom ekranu.'; note.querySelector('a').style.display = 'none' }
              }).catch(function () {})
          }
        } catch (e) { /* ignore */ }
      })()
    </script>
    <style>
      /* branded boot screen until the app mounts (replaced by React) */
      #native-return { display: none; position: fixed; inset: 0; z-index: 9999; place-items: center; text-align: center; padding: 24px; background: #0d2a52; color: #fff; font-family: Manrope, system-ui, sans-serif; }
      #native-return a { display: inline-block; margin-top: 14px; padding: 14px 24px; border-radius: 999px; background: #f5b400; color: #0d2a52; font-weight: 800; text-decoration: none; }
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #0d2a52; color: #fff; font-family: Manrope, system-ui, sans-serif; }
      .boot-splash div { display: grid; justify-items: center; gap: 14px; animation: boot-in 0.6s ease both; }
      .boot-splash svg { width: 84px; height: 84px; }
      .boot-splash strong { font-size: 1.3rem; letter-spacing: -0.01em; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="native-return"><div><p>Prijava je uspjela — vraćamo te u aplikaciju.</p><a href="#">Otvori Poso.ba aplikaciju</a></div></div>
    <div id="root"><div class="boot-splash"><div><svg viewBox="0 0 1024 1024" aria-hidden="true"><g transform="translate(-6 23)"><rect x="248" y="190" width="150" height="598" rx="75" fill="#f5b400"/><circle cx="560" cy="418" r="228" fill="#f5b400"/><circle cx="560" cy="418" r="150" fill="#0d2a52"/><path d="M478 424 L540 486 L650 358" fill="none" stroke="#f5b400" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/></g></svg><strong>Poso.ba</strong></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
