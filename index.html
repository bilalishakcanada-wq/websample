<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Archivo:wdth,wght@75..100,600..900&display=swap" />
    <meta name="theme-color" content="#0d2a52" />
    <meta name="description" content="Poso.ba — pronađite ili ponudite lokalne usluge u Bosni i Hercegovini." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poso.ba" />
    <title>Poso.ba — Marketplace za usluge</title>
    <style>
      /* branded boot screen until the app mounts (replaced by React) */
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #0d2a52; color: #fff; font-family: Manrope, system-ui, sans-serif; }
      .boot-splash div { display: grid; justify-items: center; gap: 14px; animation: boot-in 0.6s ease both; }
      .boot-splash span { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 22px; background: #f5b400; color: #0d2a52; font-weight: 800; font-size: 2rem; }
      .boot-splash strong { font-size: 1.3rem; letter-spacing: -0.01em; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash"><div><span>P</span><strong>Poso.ba</strong></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
